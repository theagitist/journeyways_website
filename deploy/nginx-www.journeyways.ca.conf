# Reference nginx vhost for www.journeyways.ca AFTER the PHP-FPM localization cutover.
# NOT auto-applied: nginx configs live in /etc/nginx, not this repo. Copy the changes
# into /etc/nginx/sites-available/www.journeyways.ca.conf, `sudo nginx -t`, reload.
# See deploy/CUTOVER.md for the full runbook. Diff vs. the pre-cutover vhost:
#   - index index.html  ->  index index.php
#   - the Node /api/ proxy (127.0.0.1:1985)  ->  a php-fpm handler for /api/contact
#   - ADD: front-controller try_files, deny app-source dirs + .json, deny stray .php
#   - KEEP: the play proxies (/api/cards, /img/cards/, /api/tiles, /img/tiles/) as-is
# The static *.html page files must be removed from the docroot so the front
# controller serves those paths (see the runbook); presentation.html + google*.html stay.

server {
    root /var/www/www.journeyways.ca;
    index index.php;
    server_name www.journeyways.ca journeyways.ca;
    include snippets/cloudflare-realip.conf;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.journeyways.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.journeyways.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    include snippets/security-hardening.conf;   # already denies dotfiles (.git/.env) + .md
    include snippets/security-headers.conf;

    limit_req zone=general burst=60 nodelay;

    # CSP unchanged (still Report-Only). challenges.cloudflare.com is already allowed
    # for the contact-page Turnstile (script-src + frame-src).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://www.googletagmanager.com https://challenges.cloudflare.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    location = /nginx.conf.example { return 404; }

    # The Cards page was renamed to Components (cards + tiles).
    location = /cards.html { return 301 /components.html; }

    # --- KEEP: play-backend proxies for the (English) card + tile galleries ---
    location = /api/cards {
        proxy_pass http://127.0.0.1:1976;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location = /api/tiles {
        proxy_pass http://127.0.0.1:1976;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ^~ /img/cards/ {
        proxy_pass http://127.0.0.1:1976;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location ^~ /img/tiles/ {
        proxy_pass http://127.0.0.1:1976;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- NEW: contact form -> PHP (replaces the Node :1985 /api/ proxy) ---
    location = /api/contact {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api/contact.php;
    }

    # --- NEW: the page front controller ---
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # --- NEW: never serve/execute app internals or dictionaries over HTTP ---
    location ~ ^/(inc|partials|templates|lang|bin|server|deploy)/ { return 404; access_log off; }
    location ~ \.json$ { return 404; access_log off; }   # lang/*.json read only by PHP
    location ~ \.php$  { return 404; access_log off; }   # exact /index.php + /api/contact above win; block the rest

    include snippets/static-cache.conf;   # long-cache css/js/fonts/img/pdf (HTML stays dynamic)

    # Real static files (css/js/img/fonts/download/sitemap.xml/robots.txt) serve
    # directly; everything else falls through to the front controller.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
}

server {
    if ($host = www.journeyways.ca) { return 301 https://$host$request_uri; } # managed by Certbot
    location = / { return 404; }
    location = /nginx.conf.example { return 404; }
    server_name www.journeyways.ca journeyways.ca;
    listen 80;
    return 404; # managed by Certbot
}
